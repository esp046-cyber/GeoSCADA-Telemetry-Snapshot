# DMZ reverse proxy in front of IIS/GeoSCADA. Only TCP 443 is open to the internet; the SCADA host accepts connections from this proxy only.
limit_req_zone  $binary_remote_addr zone=logon:10m rate=6r/m;    # brute force
limit_req_zone  $binary_remote_addr zone=api:10m   rate=10r/s;   # flood
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 1. Discovery: anything that is not our hostname gets no certificate and no banner
server { listen 443 ssl default_server; ssl_reject_handshake on; }

server {
  listen 443 ssl; http2 on;
  server_name scada.mycompany.com;
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # 3. DDoS / slow-client limits
  limit_conn perip 10;
  client_max_body_size 4k;
  client_header_timeout 5s; client_body_timeout 5s; send_timeout 10s; keepalive_timeout 15s;

  set $upstream https://10.10.20.5;          # IIS host (internal address)

  # 2. Brute force: 6 attempts/min/IP, POST only. Pair with Geo SCADA account lockout and fail2ban on repeated 401s.
  location = /logon {
    limit_req zone=logon burst=3 nodelay;
    limit_except POST OPTIONS { deny all; }
    proxy_pass $upstream;
  }
  # 1. Discovery: expose only the paths the app uses; everything else is dropped without a reply
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_except GET PUT POST OPTIONS { deny all; }
    proxy_pass $upstream;
    proxy_ssl_verify off;                    # replace with proxy_ssl_trusted_certificate + verify on once the internal cert is trusted
    proxy_connect_timeout 3s; proxy_read_timeout 10s;
  }
  location / { return 444; }
}
# fail2ban filter (failregex): ^<HOST> .* "POST /logon .*" 40[13] 
# Windows Firewall on the SCADA host: allow TCP 443 inbound only from 10.10.20.x (the proxy). Never forward 5481 or any native Geo SCADA port.
