# /etc/nginx/conf.d/geoscada.conf        Requires nginx >= 1.25.1 and OpenSSL >= 1.1.1
# Purdue DMZ reverse proxy: TLS 1.3 termination, CORS, path whitelist, rate limits. Basic auth is passed through to GeoSCADA.
# CORS is handled HERE ONLY. Do not also enable the IIS CORS module (duplicate headers break browsers).

limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;     # reads / polling
map $request_method $write_key { default ""; PUT $binary_remote_addr; POST $binary_remote_addr; }
limit_req_zone  $write_key          zone=writes:10m rate=12r/m;     # setpoint writes and alarm acks (empty key = not counted)
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;  limit_conn_status 429;

map $http_origin $cors_origin { default ""; "https://esp046-cyber.github.io" $http_origin; }
map $http_origin $origin_ok   { default 0;  ""  1; "https://esp046-cyber.github.io" 1; }   # browsers from any other site get 403

upstream geoscada { server 10.10.20.5:443; keepalive 8; }       # internal GeoSCADA/IIS host (placeholder)

# Anything that is not our hostname (IP scans, wrong SNI) gets no certificate and no banner. Port 80 is not listened on.
server { listen 443 ssl default_server; ssl_reject_handshake on; }

server {
  listen 443 ssl;
  http2 on;
  server_name scada.yourdomain.com;

  ssl_certificate     /etc/letsencrypt/live/scada.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/scada.yourdomain.com/privkey.pem;
  ssl_protocols TLSv1.3;
  ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-store" always;

  # CORS: one origin only, credentials allowed, preflight answered here
  add_header Access-Control-Allow-Origin      $cors_origin always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Headers     "Authorization, Content-Type" always;
  add_header Access-Control-Allow-Methods     "GET, PUT, POST, OPTIONS" always;
  add_header Access-Control-Max-Age           600 always;
  add_header Vary Origin always;
  if ($origin_ok = 0) { return 403; }

  # Flood and slow-client limits
  limit_conn perip 20;
  client_max_body_size 2k;
  client_header_timeout 5s;  client_body_timeout 5s;  send_timeout 10s;  keepalive_timeout 15s;
  large_client_header_buffers 2 4k;

  # Upstream: re-encrypted, certificate verified, Authorization header forwarded untouched
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host geoscada.internal.local;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Origin "";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_ssl_server_name on;
  proxy_ssl_name geoscada.internal.local;
  proxy_ssl_protocols TLSv1.2 TLSv1.3;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/nginx/tls/internal-ca.pem;
  proxy_hide_header Set-Cookie;  proxy_hide_header X-Powered-By;  proxy_hide_header Server;
  proxy_connect_timeout 3s;  proxy_read_timeout 10s;

  # Whitelist: tags (read, setpoint write) and alarms (list, acknowledge)
  location ^~ /api/tags/ {
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET PUT { deny all; }
    limit_req zone=api burst=30 nodelay;
    limit_req zone=writes burst=3 nodelay;
    proxy_pass https://geoscada;
  }
  location ^~ /api/alarms {
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET POST { deny all; }
    limit_req zone=api burst=30 nodelay;
    limit_req zone=writes burst=3 nodelay;
    proxy_pass https://geoscada;
  }
  location / { return 444; }      # everything else: connection dropped, no reply
}
