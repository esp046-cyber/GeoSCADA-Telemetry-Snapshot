<body>
<header class="top">
 <div><h1>GeoSCADA Snapshot</h1><p id="meta" class="muted">Starting…</p></div>
 <div class="row"><span id="dot" class="dot mock" role="img" aria-label="Comms status"></span><span id="badge" class="badge">MOCK</span><button id="cfgBtn" class="btn ghost" aria-label="Settings">⚙</button></div>
</header>
<div id="banner" class="banner" hidden></div>
<main>
 <section aria-labelledby="h-t"><h2 id="h-t">Tank levels</h2><div id="tanks" class="grid"></div></section>
 <section aria-labelledby="h-a"><h2 id="h-a">Active alarms</h2><div id="alarms"></div></section>
 <section aria-labelledby="h-p"><h2 id="h-p">Pump setpoints</h2><div id="pumps" class="grid"></div></section>
 <button id="install" class="btn primary wide" hidden>Install app</button>
 <p id="ios" class="muted" hidden>iPhone: tap Share, then Add to Home Screen.</p>
</main>
<dialog id="dlg">
 <form method="dialog" id="cfgForm">
  <h2>Connection</h2>
  <label class="chk"><input type="checkbox" id="mock"> Demo mode (mock data)</label>
  <label class="chk"><input type="checkbox" id="day"> Daylight mode (high contrast)</label>
  <label>Server base URL<input id="base" type="url" placeholder="https://scada.example.org:5481"></label>
  <label>API token<input id="token" type="password" autocomplete="off"></label>
  <label>Refresh (seconds)<input id="poll" type="number" min="2" max="300"></label>
  <div class="row"><button value="cancel" class="btn ghost">Cancel</button><button id="save" value="ok" class="btn primary">Save</button></div>
 </form>
</dialog>
<script src="app.js"></script>
